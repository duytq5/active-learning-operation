name: Pinned platform
description: >-
  Check out the platform commit named in platform.yaml into ./platform and
  install it, so `uv run --project platform al ...` runs that commit's CLI.
outputs:
  commit:
    description: The pinned platform commit
    value: ${{ steps.pin.outputs.commit }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        commit=$(sed -n 's/^commit: *\([0-9a-f]\{40\}\) *$/\1/p' platform.yaml)
        if [ -z "$commit" ]; then
          echo "platform.yaml must hold one line 'commit: <40-character sha>'"
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: duytq5/duytq5-leaf-al-platform
        ref: ${{ steps.pin.outputs.commit }}
        path: platform
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"
    - shell: bash
      run: uv sync --locked --project platform
