# Start a standalone training (design doc change 24): runs when a training
# file merges to main. For each added or changed configs/trainings/*.yaml it
# asks the platform's start-training Lambda to validate the training and
# insert it, then starts the al-train execution named by the training id. The
# training runs in the worker image of the platform commit pinned in
# platform.yaml, on the dataset's latest version unless the file names one. A
# refused training turns this commit's check red. Re-running the workflow
# starts nothing new. Trainings do not block rounds.
#
# Needs the repository variable AWS_ROLE_ARN (the platform stack's output
# GithubActionsRoleArn).
name: start-training

on:
  push:
    branches: [main]
    paths: ["configs/trainings/**"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: start-training
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: platform
        uses: ./.github/actions/platform
      - name: Worker image
        env:
          COMMIT: ${{ steps.platform.outputs.commit }}
        run: |
          IMAGE=ghcr.io/duytq5/duytq5-leaf-al-platform-worker:$COMMIT
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if ! docker manifest inspect "$IMAGE" > /dev/null; then
            echo "::error::No worker image $IMAGE. Pin a commit on the platform's main whose worker-image run passed, and make the GHCR package public."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Start the trainings
        env:
          BEFORE: ${{ github.event.before }}
          STARTED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'configs/trainings/*.yaml')
          else
            files=$(ls configs/trainings/*.yaml 2>/dev/null || true)
          fi
          if [ -z "$files" ]; then
            echo "No training file added or changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          machine=$(aws ssm get-parameter --name /leaf-al/state-machines/al-train \
            --query Parameter.Value --output text)
          for file in $files; do
            uv run --project platform al check-training "$file" --datasets platform/configs/datasets
            uv run --project platform al round-input "$file" --started-by "$STARTED_BY" \
              --commit-sha "$GITHUB_SHA" --image "$IMAGE" > payload.json
            failed=$(aws lambda invoke --function-name leaf-al-start-training \
              --cli-binary-format raw-in-base64-out --payload fileb://payload.json \
              --query FunctionError --output text out.json)
            if [ "$failed" != None ]; then
              echo "::error file=$file::$(jq -r '.errorMessage' out.json)"
              exit 1
            fi
            training_id=$(jq -r .training_id out.json)
            if ! aws stepfunctions start-execution --state-machine-arn "$machine" \
                --name "$training_id" --input "$(jq -c .execution out.json)" 2> err.txt; then
              grep -q ExecutionAlreadyExists err.txt || { cat err.txt; exit 1; }
              echo "Training $training_id was already started."
            fi
            echo "- \`$file\`: training \`$training_id\`, image \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          done
